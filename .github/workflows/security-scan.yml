name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"  # 每天 UTC 3:00

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@v3.82.0
        with:
          extra_args: --results=verified

  sast-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install bandit
        run: pip install bandit==1.9.2
      - name: Bandit SAST scan
        run: bandit -r mas_eval/ scripts/ *.py -c pyproject.toml -f sarif -o bandit-results.sarif

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: pip install pip-audit==2.9.0
      - name: Audit dependencies (requirements.txt)
        run: pip-audit --requirement requirements.txt --strict
      - name: Audit dependencies (project scan)
        run: pip-audit . --strict

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom==7.2.1
          cyclonedx-py environment -o sbom.xml
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.xml

  container-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # 上传 SARIF 到 Security tab 必需
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mas-eval:scan .
      - name: Trivy vulnerability scan
        uses: aquasec/trivy-action@0.24.0
        with:
          image-ref: mas-eval:scan
          format: sarif
          output: trivy-container.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-container.sarif
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-sarif
          path: trivy-container.sarif
