name: Test Suite

on:
  push:
    branches: [main, develop, phase*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[ml,dev]"

      - name: Lint with ruff
        run: ruff check mas_eval/ tests/ --statistics

      - name: Type check with mypy
        run: mypy mas_eval/ tests/ --strict --ignore-missing-imports --no-incremental

      - name: Test with pytest
        run: pytest tests/ -v --tb=short --durations=10 --cov=mas_eval --cov=tests --cov-report=term-missing

      - name: Check coverage
        run: |
          COV=$(python -m coverage report --format=total 2>/dev/null || echo "0")
          echo "Coverage: $COV%"
          if [ "$(echo "$COV < 85" | bc)" -eq 1 ]; then
            echo "::error::Coverage $COV% below threshold 85%"
            exit 1
          fi
          echo "✅ Coverage $COV% meets threshold"

      - name: Run federation scan (multi-vendor CI gate)
        env:
          # v0.4.0 threshold policy (Phase 7.2): allow documented staged rollout
          # by overriding FEDERATION_MAX_BLOCKED / FEDERATION_ALLOW_CRITICAL.
          # Default: 0 blocked, no CRITICAL, at least 3/5 passing.
          FEDERATION_MAX_BLOCKED: ${{ vars.FEDERATION_MAX_BLOCKED || '0' }}
          FEDERATION_MIN_PASSING: ${{ vars.FEDERATION_MIN_PASSING || '3' }}
          FEDERATION_ALLOW_CRITICAL: ${{ vars.FEDERATION_ALLOW_CRITICAL || 'false' }}
        run: |
          echo "::group::Federation Scan"
          python mas_full_run.py --multi-vendor mas_eval/data/multi_vendor_test/ \
            --output reports/federation-scan.json \
            --compliance-format html
          echo "::endgroup::"
          ALLOW_CRITICAL_FLAG=""
          if [ "$FEDERATION_ALLOW_CRITICAL" = "true" ]; then
            ALLOW_CRITICAL_FLAG="--allow-critical"
          fi
          python scripts/federation_threshold.py reports/federation-scan.json \
            --max-blocked "$FEDERATION_MAX_BLOCKED" \
            --min-passing "$FEDERATION_MIN_PASSING" \
            $ALLOW_CRITICAL_FLAG

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: federation-compliance-report
          path: |
            reports/federation-scan.json
            reports/federation-scan.html
          retention-days: 14
