name: Test Suite

on:
  push:
    branches: [main, develop, phase*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[ml,dev]"

      - name: Lint with ruff
        run: ruff check mas_eval/ --statistics

      - name: Test with pytest
        run: pytest tests/ -v --tb=short --durations=10 --cov=mas_eval --cov-report=term-missing

      - name: Check coverage
        run: |
          COV=$(python -m coverage report --format=total 2>/dev/null || echo "0")
          echo "Coverage: $COV%"
          if [ "$(echo "$COV < 85" | bc)" -eq 1 ]; then
            echo "::error::Coverage $COV% below threshold 85%"
            exit 1
          fi
          echo "✅ Coverage $COV% meets threshold"
