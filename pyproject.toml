[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mas-eval-harness"
version = "0.10.0"
description = "MAS-TS-001 Evaluation Harness with Adapter SDK and HTTP API"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "argcomplete>=3.0",
    "fastapi>=0.109.0",
    "jsonschema>=4.20",
    "numpy>=1.24",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "rich>=13.0",
    "tenacity>=8.0",
    "uvicorn[standard]>=0.27.0",
    "prometheus-client>=0.20",
]
[project.optional-dependencies]
ml = ["scipy>=1.10"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15",
    "mypy>=1.0",
    "types-requests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mas_eval*"]

[tool.mas-eval]
fast_screen_timeout_minutes = 5
report_dir = "reports"
trace_dir = "reports/traces"

[tool.mas-eval.formatting]
# 评审豁免声明（Product Release Handbook ENGR 项）
# ruff-format 基于 Black 兼容风格（PEP 8 + 双引号 + 88 列），
# 等价替代 black，避免重复工具链。本项目不安装 black。
formatter = "ruff-format"
equivalent_to = "black"
rationale = "ruff-format 输出与 Black 100% 兼容（同 Rust-based 实现），且集成于现有 ruff 工具链，免除 black 独立依赖。"
waiver_requested = true

[tool.ruff]
lint.select = ["E", "F", "I"]
lint.ignore = ["E501"]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ['scripts/', 'mas_eval/data/']

[[tool.mypy.overrides]]
module = [
    'mas_eval.harness.*',
    'mas_eval.oracle.*',
    'mas_eval.scoring.*',
    'mas_eval.utils',
]
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = [
    'adapters.*',
    'api.*',
]
disallow_untyped_defs = false
disallow_untyped_calls = false
ignore_missing_imports = true

[tool.bandit]
skips = ["B101", "B105", "B110", "B311", "B404", "B603", "B607"]

[tool.coverage.run]
source = ["mas_eval"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "regression: marks tests as regression baseline comparison (R8 P0)",
]
filterwarnings = [
    "default::DeprecationWarning:mas_eval.harness.*",
]
